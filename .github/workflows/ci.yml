name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps (no ViGEm required)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Pytest
        run: python -m pytest tests -q
